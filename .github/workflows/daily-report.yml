# .github/workflows/daily-report.yml

name: Daily AI Finance Report

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 WIB
  workflow_dispatch:

permissions:
  contents: write   # WAJIB agar workflow bisa commit balik report_history.db

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Finance Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit riwayat laporan (jika ada perubahan)
        run: |
          git config user.name "AI Finance Agent Bot"
          git config user.email "actions@github.com"
          git add report_history.db
          git diff --cached --quiet || git commit -m "chore: update report history [skip ci]"
          git push